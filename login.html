<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito | Urtiga do Juruá</title>
    <!-- Fontes: Playfair para a Logo, Inter para o Form -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0b0d10;
            --bg-card: #16191f;
            --border-color: #2b303b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #cfa858;
            --accent-hover: #e3be6d;
            --input-bg: #0f1115;
            --radius: 12px; /* Cantos mais suaves */
            --accent-red: #ef4444;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Efeito de luz focada no centro da tela */
            background-image: radial-gradient(circle at center, #1c2028 0%, #0b0d10 70%);
        }

        .login-container {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin: 0 0 5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .logo-icon { color: var(--accent); font-size: 2.2rem; line-height: 1; }

        .login-subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 2.5rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        /* Anel de foco dourado ao clicar no input */
        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(207, 168, 88, 0.15);
        }

        .btn-submit {
            background-color: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-submit:hover { background-color: var(--accent-hover); }
        .btn-submit:active { transform: scale(0.98); }

        /* Estilo moderno para o alerta de erro */
        .erro-msg {
            color: var(--accent-red);
            font-size: 0.85rem;
            margin-top: 1.5rem;
            display: none;
            font-weight: 500;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1 class="logo"><span class="logo-icon">𐃆</span> Redação</h1>
        <div class="login-subtitle">
            <!-- Ícone de cadeado em SVG -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Acesso Seguro
        </div>
        
        <form id="form-login">
            <div class="form-group">
                <label>E-mail Corporativo</label>
                <input type="email" id="email" required placeholder="editor@urtigadojurua.com">
            </div>
            <div class="form-group">
                <label>Senha de Acesso</label>
                <input type="password" id="senha" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn-submit btn-apoio">Entrar no Sistema</button>
            
            <p id="mensagem-erro" class="erro-msg">Credenciais inválidas. Tente novamente.</p>
        </form>
    </div>

    <!-- Scripts da ponte Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
